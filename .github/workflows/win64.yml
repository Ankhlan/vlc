name: win64

on:
  push:
    branches: [dj]
  workflow_dispatch:

jobs:
  win64:
    runs-on: ubuntu-latest
    container:
      image: registry.videolan.org/vlc-debian-win64-3.0:20260820114402
      # the image sets a non-root USER; the runner's state files are root-owned
      options: --user root
    env:
      # the contrib archive VideoLAN built for the last commit that touched contrib/ before 3.0.24
      VLC_PREBUILT_CONTRIBS_URL: https://artifacts.videolan.org/vlc-3.0/win64/vlc-contrib-x86_64-w64-mingw32-910cc9cada6080dd777fbafb2ebdd0c24f702c30.tar.zst
    steps:
      - uses: actions/checkout@v4
      - name: Build (release, prebuilt contribs)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          extras/package/win32/build.sh -a x86_64 -p -r
      - name: What came out
        run: ls -la win64/ | head -40; ls -la win64/vlc-*-win64* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: vlc-dj-win64
          path: |
            win64/vlc-*-win64.zip
            win64/vlc-*-win64.7z
          if-no-files-found: error
